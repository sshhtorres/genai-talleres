[project]
name = "taller02-rag"
version = "0.1.0"
description = "Taller 2: RAG para la atención al cliente de EcoMarket"
requires-python = ">=3.12"
dependencies = [
    "genai-common[langchain]",
    "taller01-ecomarket",
    "typer>=0.12",
    "langchain-text-splitters==1.1.3",
    "langchain-postgres==0.0.19",
    "psycopg[binary]>=3.2",
    "pypdf>=6.0",
    "psutil>=7.0",
    "httpx>=0.27",
]


[project.scripts]
taller02 = "taller02_rag.cli:app"

[tool.uv.sources]
genai-common = { workspace = true }
taller01-ecomarket = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taller02_rag"]
