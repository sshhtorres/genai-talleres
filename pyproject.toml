[project]
name = "genai-talleres"
version = "0.1.0"
description = "Monorepo de talleres del curso de IA Generativa"
requires-python = ">=3.12"
dependencies = [
    "genai-common",
    "taller01-ecomarket",
    "taller02-rag",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "taller-*"]

[tool.uv.sources]
genai-common = { workspace = true }
taller01-ecomarket = { workspace = true }
taller02-rag = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[tool.ruff]
line-length = 100
target-version = "py312"
# El script de clase original se conserva literal, como referencia: no se ajusta a las reglas.
extend-exclude = ["taller-02-ecomarket-rag/scripts/rag_ejemplo_original.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# La tabla "Qué cambió y por qué" del script modernizado es más ancha que 100 columnas.
"taller-02-ecomarket-rag/scripts/rag_ejemplo_modernizado.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["genai_common", "taller01", "taller02_rag"]

[tool.pytest.ini_options]
# Los globs incluyen cada taller nuevo sin tener que registrarlo aquí.
testpaths = ["packages", "taller-*"]
# importlib permite que dos paquetes tengan un test_prompts.py cada uno.
# Las pruebas de integración (Postgres real) se excluyen por defecto: `uv run pytest -m integration`.
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: necesita servicios reales (Postgres + pgvector); no usa red ni claves"]
