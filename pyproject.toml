[project]
name = "genai-talleres"
version = "0.1.0"
description = "Monorepo de talleres del curso de IA Generativa"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "taller-*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
