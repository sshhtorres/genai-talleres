[project]
name = "genai-talleres"
version = "0.1.0"
description = "Monorepo de talleres del curso de IA Generativa"
requires-python = ">=3.12"
dependencies = [
    "genai-common",
    "taller01-ecomarket",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "taller-*"]

[tool.uv.sources]
genai-common = { workspace = true }
taller01-ecomarket = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["genai_common", "taller01"]

[tool.pytest.ini_options]
testpaths = ["packages", "taller-01-ecomarket"]
