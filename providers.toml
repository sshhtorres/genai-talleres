# Única fuente de verdad de los IDs de modelo.
# Los IDs cambian rápido: si una llamada falla con 404, actualiza SOLO este archivo.

default = "gemini"
# Configuración RAG por defecto (Taller 2) si RAG_CONFIG no está definida en el entorno.
rag_default = "nube"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "gemini-3.5-flash-lite"
models = { liviano = "gemini-3.5-flash-lite", router = "gemini-3.1-flash-lite", robusto = "gemini-3.1-pro-preview" }
status = "implementado"
# Verificado el 2026-09-23 contra la API:
#  - gemini-3.8-flash se descartó como motor del 80%: su tier gratuito permite 20 peticiones por DÍA
#    y, por ser un modelo con razonamiento, con max_tokens bajo consume todo el presupuesto pensando
#    y devuelve texto vacío. Para redactar sobre un contexto ya recuperado ese razonamiento no aporta.
#  - gemini-3.5-flash-lite responde en menos de 1 s, no gasta tokens en razonamiento y tiene cuota
#    gratuita suficiente: es el modelo recomendado en la Fase 1 y el que ejecuta su evidencia.
notas = "Tier gratuito. Motor del 80% repetitivo: gemini-3.5-flash-lite. El modelo 'robusto' (pro) es de pago."

# Taller 2: integración nativa de LangChain (genai_common.lc). El Taller 1 sigue usando base_url,
# el endpoint compatible con OpenAI, a través de LLMClient.
[providers.gemini.langchain]
integracion = "google_genai"
# gemini-3.5-flash-lite usa valores de muestreo fijos: ChatGoogleGenerativeAI avisa en cada llamada
# que ignora `temperature`. Se omite solo aquí; el Taller 1 (LLMClient) no cambia.
omit_params = ["temperature"]

[providers.ollama]
base_url = "http://localhost:11434/v1"
api_key_env = ""
# El modelo efectivo lo fija el nivel de hardware ([niveles.*], LOCAL_TIER); este es el de cpu-16gb.
model = "gemma4:e4b"
# Probado el 2026-10-14 en local (Ollama 0.40.4, WSL2 ARM64, solo CPU): /v1 responde.
status = "implementado"
# Gemma 4 piensa por defecto (`ollama show` → thinking default true). Sin desactivarlo, una
# respuesta de una frase tardó 36-89 s y, con max_tokens=200, salió vacía: todo se fue en pensar.
# `reasoning_effort` es un parámetro estándar de OpenAI y Ollama lo respeta en /v1 (4-7 s, ~30
# tokens); `"think": false` en cambio se ignora por /v1. Responder sobre un contexto ya
# recuperado no necesita razonamiento.
params = { reasoning_effort = "none" }
# Red de seguridad si algún día se quita `reasoning_effort` (mismo patrón que anthropic).
max_tokens_min = 2000
notas = "Ollama local por su endpoint compatible con OpenAI (/v1). No requiere key: se envía 'ollama' como valor ficticio."

[providers.ollama.langchain]
integracion = "ollama"
base_url = "http://localhost:11434"   # API nativa de Ollama, sin /v1
# Equivalente nativo de reasoning_effort = "none": ChatOllama envía think=false.
params = { reasoning = false }

[providers.anthropic]
base_url = "https://api.anthropic.com/v1/"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
models = { liviano = "claude-sonnet-5", router = "claude-haiku-5-5", robusto = "claude-opus-5-5" }
status = "implementado"
# claude-sonnet-5 rechaza `temperature` ("deprecated for this model"), así que se omite.
# El determinismo se mantiene con las instrucciones del prompt, no con el parámetro.
# claude-haiku-5-5 (rol router desde el Taller 2, verificado en su documentación el 2026-10-14)
# también rechaza `top_p` y `top_k` con un error 400. Las corridas del Taller 1 usaron
# claude-haiku-4-5-20251001 en este rol.
omit_params = ["temperature", "top_p", "top_k"]
# Haiku 5.5 piensa de forma adaptativa por defecto y, según su documentación, esos tokens cuentan
# dentro de max_tokens: con un valor pequeño podría cortarse antes de escribir texto. En la prueba
# local del 2026-10-14 no se reprodujo (max_tokens=50 respondió una palabra), pero la clasificación
# cambió frente a max_tokens=4000. Se mantiene el mínimo por precaución en las cadenas del Taller 2.
# Por la capa compatible: `reasoning_effort` se ignora, `thinking` adaptativo da 400 y
# `output_config.effort` se acepta solo vía `extra_body` (sin ahorro medible en una muestra).
max_tokens_min = 4000
# Precio por millón de tokens (prompts ≤ 100.000 tokens), verificado en la documentación de Anthropic
# el 2026-10-14. Solo se registran los precios verificados; los demás modelos quedan sin costo
# estimado en el experimento E8.
precios_usd_mtok = { "claude-haiku-5-5" = { entrada = 0.10, salida = 0.50 } }
notas = "Capa de compatibilidad OpenAI de Anthropic. DE PAGO: se usa como segundo proveedor en la comparación de la Fase 3."

[providers.anthropic.langchain]
integracion = "anthropic"
# ChatAnthropic sí controla el pensamiento adaptativo y el esfuerzo (por la capa compatible, no).
# No se fija `reasoning_effort` hasta medirlo: queda el valor por defecto del modelo (medium).

[providers.fake]
base_url = ""
api_key_env = ""
model = "fake-determinista"
status = "tests"
notas = "Proveedor determinístico en memoria. Los tests y la CI nunca llaman a una API real."

# =============================================================================
# Embeddings (Taller 2). Cada perfil es un espacio vectorial distinto: su tabla en la base es
# kb_<perfil>_<dimensiones> y NUNCA se mezclan vectores de perfiles distintos, aunque la dimensión
# coincida (gemini y embeddinggemma son ambos de 768 e incompatibles).
# =============================================================================

[embeddings.gemini]
backend = "google"
model = "gemini-embedding-001"
dimensions = 768            # MRL: 3072 truncado a 768 (el HNSW de pgvector admite hasta 2000)
api_key_env = "GEMINI_API_KEY"
task_type_document = "RETRIEVAL_DOCUMENT"
task_type_query = "RETRIEVAL_QUERY"
status = "implementado"
notas = "Nivel gratuito de la API de Gemini. Configuración nube."

[embeddings.embeddinggemma]
backend = "ollama"
model = "embeddinggemma:300m"
dimensions = 768
base_url = "http://localhost:11434"
# Ollama no añade los prefijos de tarea: sin ellos no hay error, pero la recuperación empeora.
query_prefix = "task: search result | query: "
document_prefix = "title: none | text: "
status = "implementado"
notas = "Local vía Ollama (ollama pull embeddinggemma:300m). Configuraciones hibrida y local."

[embeddings.bge_m3]
backend = "ollama"
model = "bge-m3"
# Siempre 1024: bge-m3 no está entrenado con MRL. Ollama acepta `dimensions` menores sin avisar y
# trunca igual, pero el vector truncado pierde calidad.
dimensions = 1024
base_url = "http://localhost:11434"
status = "implementado"
notas = "Alternativa local (ollama pull bge-m3): 8.192 tokens de contexto. Experimento E4."

[embeddings.fake]
backend = "fake"
model = "lexico-hash"
dimensions = 256
status = "tests"
notas = "Determinista y sin red (bolsa de palabras con hash). Tests, CI y demostraciones sin claves."

# =============================================================================
# Configuraciones de ejecución del RAG (RAG_CONFIG en .env). Embedding y LLM son piezas
# independientes: lo único que debe coincidir es el embedding de indexación y el de consulta.
# =============================================================================

[configuraciones.nube]
descripcion = "Todo con GEMINI_API_KEY: embeddings y LLM de Gemini."
embeddings = "gemini"
llm = "gemini"

[configuraciones.hibrida]
descripcion = "Embeddings locales (Ollama) + LLM en la nube elegido con RAG_LLM."
embeddings = "embeddinggemma"
llm_opciones = ["gemini", "anthropic"]
# Con anthropic se genera con el modelo del rol router (Claude Haiku 5.5), no con el de por defecto.
rol_llm = { anthropic = "router" }

[configuraciones.local]
descripcion = "Todo en Ollama; el modelo de chat lo fija el nivel de hardware (LOCAL_TIER)."
embeddings = "embeddinggemma"
llm = "ollama"
usa_niveles = true
nivel_por_defecto = "cpu-16gb"

[configuraciones.pruebas]
descripcion = "Sin red: embeddings y LLM falsos. Para tests, CI y el notebook sin claves."
embeddings = "fake"
llm = "fake"

# Niveles de hardware de la configuración local. Son explícitos (no se autodetectan): la RAM se
# lee fácil, la VRAM y el ancho de banda de memoria no. Solo cpu-16gb se ejecuta en el taller.
[niveles.cpu-8gb]
llm_model = "gemma4:e2b"
ram_min_gb = 8

[niveles.cpu-16gb]
llm_model = "gemma4:e4b"
ram_min_gb = 16

[niveles.gpu-12gb]
llm_model = "gemma4:12b"
vram_gb = 12

[niveles.gpu-24gb]
llm_model = "gemma4:26b"
vram_gb = 24
