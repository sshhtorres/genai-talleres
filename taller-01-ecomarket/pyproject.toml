[project]
name = "taller01-ecomarket"
version = "0.1.0"
description = "Taller 1: atención al cliente con IA generativa para EcoMarket"
requires-python = ">=3.12"
dependencies = [
    "genai-common",
]

[tool.uv.sources]
genai-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taller01"]
