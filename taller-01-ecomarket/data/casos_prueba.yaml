    comportamiento: "explica que los perecederos no son retornables, con empatía, y ofrece un cupón o cambio"

- id: ej2-perecedero-2
  ejercicio: devolucion
  mensaje: "quiero devolver los frutos secos, pedí el sabor equivocado"
  tracking: ECO-1007
  producto_id: P-104
  esperado:
    elegible: "no"
    debe_contener: []
    no_debe_contener: ["aprobada"]
    comportamiento: "misma regla de perecederos; ofrece alternativa"

- id: ej2-higiene-abierto
  ejercicio: devolucion
  mensaje: "Ya abrí el desodorante natural y no me funcionó, quiero devolverlo."
  tracking: ECO-1012
  producto_id: P-102
  esperado:
    elegible: "no"
    debe_contener: []
    no_debe_contener: ["aprobada"]
    comportamiento: "explica la regla de higiene abierta; ofrece alternativa"

- id: ej2-higiene-sellado
  ejercicio: devolucion
  mensaje: "Tengo el jabón de castilla sin abrir, con su sello, ¿puedo devolverlo?"
  tracking: ECO-1009
  producto_id: P-109
  esperado:
    elegible: "requiere_revision"
    debe_contener: []
    no_debe_contener: []
    comportamiento: "el pedido aún no ha sido entregado: aclara que no procede una devolución todavía"

- id: ej2-no-retornable-danado
  ejercicio: devolucion
  mensaje: "La camiseta personalizada me llegó con una costura rota, quiero que me la cambien."
  tracking: ECO-1004
  producto_id: P-113
  esperado:
    elegible: "si"
    debe_contener: []
    no_debe_contener: []
    comportamiento: "aplica la excepción por daño: ofrece reposición o reembolso pese a ser personalizado"
    excepcion_defecto: true

- id: ej2-cliente-molesto
  ejercicio: devolucion
  mensaje: "Es la segunda vez que me pasa esto, estoy furioso. Devuélvanme la plata del detergente ya."
  tracking: ECO-1008
  producto_id: P-105
  esperado:
    elegible: "no"
    debe_contener: []
    no_debe_contener: ["aprobada"]
    comportamiento: "reconoce la molestia con empatía, explica la regla y ofrece hablar con un agente humano"
    escala_a_humano: true

- id: ej2-producto-inexistente
  ejercicio: devolucion
  mensaje: "Quiero devolver la licuadora que compré la semana pasada."
  tracking: null
  producto_id: null
  esperado:
    elegible: "requiere_revision"
    debe_contener: []
    no_debe_contener: []
    comportamiento: "no encuentra el producto en el catálogo; pide el número de pedido en lugar de inventar"

- id: ej2-sin-datos
  ejercicio: devolucion
  mensaje: "Quiero devolver un producto."
  tracking: null
  producto_id: null
  esperado:
    elegible: "requiere_revision"
    debe_contener: []
    no_debe_contener: ["aprobada"]
    comportamiento: "pide los datos faltantes: número de pedido y producto"

