  producto_id: P-107
  esperado:
    elegible: "no"
    debe_contener: []
    no_debe_contener: ["aprobada", "procederemos con el reembolso"]
    comportamiento: "explica con empatía que pasaron más de 30 días desde la entrega y ofrece una alternativa"

- id: ej2-perecedero
